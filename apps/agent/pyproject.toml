[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "actiscape-agent"
version = "0.3.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "langgraph>=1,<2", "langchain>=1,<2", "langchain-deepseek>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4", "fastapi>=0.115,<1", "uvicorn>=0.35,<1",
  "Pillow>=12,<14", "opencv-python-headless>=4.12,<5", "httpx>=0.28,<1", "pydantic>=2,<3", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]
platform = ["agentarts-sdk==0.1.10"]

[tool.setuptools]
packages = ["actiscape_agent"]

[tool.setuptools.package-data]
actiscape_agent = [
  "skills/*.json",
  "skills/*.md",
  "skills/*/*.json",
  "skills/*/*.md",
  "skills/*/LICENSE",
  "skills/LICENSES/*.txt",
  "skills/*/examples/*/*.json",
  "skills/*/examples/*/*.md",
  "vendor/house_plan_designer/LICENSE",
  "vendor/house_plan_designer/*.json",
  "vendor/house_plan_designer/scripts/*.py",
  "vendor/house_plan_designer/reference/*.json",
  "vendor/house_plan_designer/reference/*.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["actiscape_agent/vendor"]
