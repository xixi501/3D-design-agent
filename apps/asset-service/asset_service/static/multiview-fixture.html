<!doctype html>
<html><head><meta charset="utf-8"><script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script></head>
<body style="margin:0;background:#fff"><canvas id="canvas" width="640" height="640"></canvas><script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
const canvas = document.querySelector("#canvas");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.background = new THREE.Color("#ffffff");
const pmrem = new THREE.PMREMGenerator(renderer);
const room = new RoomEnvironment(renderer);
scene.environment = pmrem.fromScene(room, 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 0.8));
const light = new THREE.DirectionalLight(0xffffff, 2.2);
light.position.set(3, 5, 4);
scene.add(light);
const camera = new THREE.PerspectiveCamera(36, 1, 0.01, 100);
const model = new URLSearchParams(location.search).get("model") || "sofa-01";
const gltf = await new GLTFLoader().loadAsync(`/hero-assets/${model}.glb`);
const object = gltf.scene;
const bounds = new THREE.Box3().setFromObject(object);
const center = bounds.getCenter(new THREE.Vector3());
const size = bounds.getSize(new THREE.Vector3());
object.position.sub(new THREE.Vector3(center.x, bounds.min.y, center.z));
scene.add(object);
const radius = Math.max(size.x, size.y, size.z);
window.__setAngle = (angle) => {
  if (angle === "top") {
    camera.position.set(0, radius * 2.5, 0.001);
    camera.up.set(0, 0, -1);
  } else {
    const degrees = { front: 0, back: 180, left: -90, right: 90 }[angle] || 0;
    const radians = degrees * Math.PI / 180;
    camera.position.set(Math.sin(radians) * radius * 2.2, radius * 0.65, Math.cos(radians) * radius * 2.2);
    camera.up.set(0, 1, 0);
  }
  camera.lookAt(0, radius * 0.42, 0);
  renderer.render(scene, camera);
  return canvas.toDataURL("image/png");
};
window.__fixtureReady = true;
</script></body></html>
