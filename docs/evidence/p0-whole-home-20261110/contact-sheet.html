<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box} body{margin:0;background:#f4f2ee;color:#24211d;font-family:"Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif}
  .page{width:1600px;padding:40px 48px 46px}
  h1{margin:0;font-size:34px;letter-spacing:.02em} .sub{margin:8px 0 24px;color:#6b645b;font-size:16px}
  .hero{position:relative;border-radius:14px;overflow:hidden;background:#eef2f6;box-shadow:0 10px 28px rgba(40,35,28,.12)}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:20px}
  figure{margin:0;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 6px 18px rgba(40,35,28,.09)}
  figure img{display:block;width:100%;height:300px;object-fit:cover}
  figcaption{padding:12px 14px 14px;font-size:15px;display:flex;flex-direction:column;gap:3px}
  figcaption span{color:#6b645b;font-size:13px}
  .foot{display:flex;justify-content:space-between;margin-top:18px;color:#7a7369;font-size:13px}
